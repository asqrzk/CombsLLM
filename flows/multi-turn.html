<!DOCTYPE html>
<!-- multi-turn flow — windowed-context chat: only the last N turns are
     sent (sliding window), with a live preview of the next request.
     The lightweight contrast to kv-chat's full-transcript strategy. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>CombsLLM — multi-turn</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/flows.css">
<style>
  main { display:grid; grid-template-columns:1fr 340px; gap:16px; padding:16px 20px; max-width:1100px; margin:0 auto; }
  @media (max-width:900px) { main { grid-template-columns:1fr; } }
  #preview { font:11px/1.5 ui-monospace,monospace; color:var(--dim); white-space:pre-wrap; max-height:40vh; overflow:auto; background:var(--bg); border-radius:8px; padding:8px; }
  #win { font-size:12px; color:var(--dim); margin-bottom:8px; }
</style>
</head>
<body>
<header>
  <h1>🪟 multi-turn</h1>
  <span>sliding-window context · repetition penalty · see exactly what the model sees</span>
  <a href="/flows/">← flows</a>
</header>
<main id="main" hidden>
  <div class="panel">
    <h2>Chat (windowed)</h2>
    <div id="chatlog"></div>
    <div id="composer">
      <input id="inp" placeholder="chat normally — the window slides after 12 turns…" autofocus>
      <button id="send">Send</button>
    </div>
  </div>
  <div class="panel">
    <h2>Next request context</h2>
    <div id="win"></div>
    <div id="preview"></div>
  </div>
</main>
<div id="setup" hidden></div>
<script type="module">
import { streamChatWithUsage, engineBase } from '../atoms/engine/index.js';
import { hasServer } from '../atoms/auth/index.js';

const $ = (id) => document.getElementById(id);
const SYSTEM = 'You are a helpful assistant. Answer concisely.';
const WINDOW = 12;

const turns = [];  // {role, content}
let busy = false;

function bubble(cls, text) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls; d.textContent = text;
  $('chatlog').appendChild(d); $('chatlog').scrollTop = 1e9;
  return d;
}

function windowed() {
  return turns.slice(-WINDOW);
}

function renderPreview() {
  const w = windowed();
  $('win').textContent = `window: last ${w.length} of ${turns.length} turns${turns.length > WINDOW ? ' — older turns dropped' : ''}`;
  $('preview').textContent =
    `[system] ${SYSTEM}\n` +
    w.map((m) => `[${m.role}] ${m.content.slice(0, 140)}${m.content.length > 140 ? '…' : ''}`).join('\n');
}

async function send() {
  const inp = $('inp'), text = inp.value.trim();
  if (!text || busy) return;
  busy = true; inp.value = ''; $('send').disabled = true;

  turns.push({ role: 'user', content: text });
  bubble('user', text);
  const reply = bubble('bot', '');
  const cursor = document.createElement('span');
  cursor.className = 'cursor'; cursor.textContent = '▍';
  reply.appendChild(cursor);
  renderPreview();

  const messages = [{ role: 'system', content: SYSTEM }, ...windowed()];
  let generated = '';

  await streamChatWithUsage('', messages, { maxTokens: 256, temperature: 0.7, presencePenalty: 1.15 }, {
    onDelta(t) {
      generated += t;
      reply.textContent = generated;
      reply.appendChild(cursor);
      $('chatlog').scrollTop = 1e9;
    },
    onDone() {
      cursor.remove();
      turns.push({ role: 'assistant', content: generated });
      renderPreview();
    },
    onError(e) {
      cursor.remove();
      reply.textContent = `error: ${e.message}`;
    },
  });

  busy = false; $('send').disabled = false; inp.focus();
}
$('send').onclick = send;
$('inp').addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); });

(async () => {
  if (!(await hasServer())) {
    $('setup').hidden = false;
    $('setup').innerHTML = `<h2>multi-turn needs an engine</h2>
      <p>Start <code>combs serve --model … --port 8080</code> and open via
      <code>deno task serve</code>.<br>Engine URL: <code>${engineBase()}</code></p>`;
    return;
  }
  $('main').hidden = false;
  renderPreview();
  bubble('sys', `engine: ${engineBase()} · window = ${WINDOW} turns`);
})();
</script>
</body>
</html>
